<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Last.fm Scrobbler — YouTube Music</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f0f0f;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #0f0f0f;
    }
    #status {
      position: fixed;
      z-index: 10;
      left: 8px;
      right: 8px;
      bottom: 8px;
      padding: 7px 9px;
      border-radius: 6px;
      background: rgba(20, 20, 20, .92);
      color: #ddd;
      font: 12px/1.35 Arial, sans-serif;
      box-shadow: 0 2px 10px rgba(0,0,0,.35);
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease;
    }
    #status.show { opacity: 1; }
  </style>
</head>
<body>
  <iframe
    id="music"
    src="https://music.youtube.com/"
    title="YouTube Music"
    allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <div id="status" aria-live="polite"></div>
  <script src="index.js"></script>
</body>
</html>
